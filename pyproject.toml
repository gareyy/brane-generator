[project]
name = "brane-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gareyyy", email = "gk10guce@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.6.3",
    "jupyterlab-vim>=4.1.4",
    "kitcat>=2.0.2",
    "matplotlib>=3.11.1",
    "scipy>=1.17.1",
    "torch>=2.14.0",
    "torchcodec>=0.16.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.0",
]

[project.scripts]
brane-generator = "brane_generator:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
